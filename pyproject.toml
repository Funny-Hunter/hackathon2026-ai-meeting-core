[project]
name = "hackathon2026-ai-meeting-core"
version = "0.1.0"
description = "Backend demo for an AI meeting analysis assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "langchain==0.3.7",
    "langchain-openai==0.2.6",
    "langchain-community==0.3.7",
    "langchain-core==0.3.17",
    "langgraph==0.2.38",
    "qdrant-client==1.11.3",
    "langchain-qdrant==0.2.0",
    "neo4j>=5.26.0",
    "graphiti-core==0.29.1",
    "openai>=1.91.0,<2.0.0",
    "pydantic>=2.11.5,<3.0.0",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "httpx==0.27.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
